services:
  postgres:
    image: postgres:16-alpine
    container_name: districall_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: districall
      POSTGRES_PASSWORD: districall
      POSTGRES_DB: districall
    ports:
      - "5433:5432"
    volumes:
      - districall_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U districall"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  districall_pgdata:
