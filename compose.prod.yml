name: districall

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-districall}
      POSTGRES_USER: ${POSTGRES_USER:-districall}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - private

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-districall}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-districall}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env.production}
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-15}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}
      IMPERSONATION_TOKEN_EXPIRE_MINUTES: ${IMPERSONATION_TOKEN_EXPIRE_MINUTES:-30}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}
      INTEGRATION_ENCRYPTION_KEY: ${INTEGRATION_ENCRYPTION_KEY:?Set INTEGRATION_ENCRYPTION_KEY in .env.production}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-}
      INTEGRATION_POLL_INTERVAL_SECONDS: ${INTEGRATION_POLL_INTERVAL_SECONDS:-300}
      WHATSAPP_BRIDGE_URL: ${WHATSAPP_BRIDGE_URL:-http://whatsapp-bridge:3001}
      WHATSAPP_BRIDGE_TOKEN: ${WHATSAPP_BRIDGE_TOKEN:-}
      WHATSAPP_BRIDGE_TIMEOUT_SECONDS: ${WHATSAPP_BRIDGE_TIMEOUT_SECONDS:-15}
      ATTENDANCE_TIMEZONE: ${ATTENDANCE_TIMEZONE:-Asia/Kolkata}
    depends_on:
      db:
        condition: service_healthy
      whatsapp-bridge:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5)"
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - private

  attendance-closer:
    build:
      context: ./backend
    command: ["python", "-m", "app.services.attendance_closer"]
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-districall}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-districall}
      ATTENDANCE_TIMEZONE: ${ATTENDANCE_TIMEZONE:-Asia/Kolkata}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "from datetime import datetime, timezone; from pathlib import Path; p = Path('/tmp/attendance-closer-health'); raise SystemExit(0 if p.exists() and (datetime.now(timezone.utc) - datetime.fromisoformat(p.read_text())).total_seconds() < 180 else 1)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
    networks:
      - private

  whatsapp-bridge:
    build:
      context: ./whatsapp-bridge
    restart: unless-stopped
    environment:
      PORT: 3001
      DATA_DIR: /data
      BRIDGE_API_TOKEN: ${WHATSAPP_BRIDGE_TOKEN:-}
    volumes:
      - whatsapp_auth:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - private

  web:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: /api
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - private

  caddy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy
    networks:
      - private

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
  whatsapp_auth:

networks:
  private:
    driver: bridge
